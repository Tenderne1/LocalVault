name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LocalVault ${{ github.ref_name }}
          releaseBody: |
            LocalVault ${{ github.ref_name }} Windows release.

            See the assets below for the EXE installer, MSI installer and updater artifacts.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterSignatures: true

      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-portable.ps1

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $out = "SHA256SUMS.txt"
          if (Test-Path $out) { Remove-Item $out -Force }
          Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path)" } |
            Set-Content $out
          if (Test-Path "release/LocalVault-Portable-x64.zip") {
            (Get-FileHash "release/LocalVault-Portable-x64.zip" -Algorithm SHA256).Hash + "  release/LocalVault-Portable-x64.zip" | Add-Content $out
          }

      - name: Upload portable package and checksums
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" `
            "release/LocalVault-Portable-x64.zip" `
            "SHA256SUMS.txt" `
            --clobber
