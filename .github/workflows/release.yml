name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Compose release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          .\scripts\release-notes.ps1 -Tag "${{ github.ref_name }}"
          $body = Get-Content "release-notes.md" -Raw -Encoding utf8
          "body<<RELEASE_BODY_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "RELEASE_BODY_EOF" >> $env:GITHUB_OUTPUT

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LocalVault ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterSignatures: true

      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-portable.ps1

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $out = "SHA256SUMS.txt"
          if (Test-Path $out) { Remove-Item $out -Force }
          Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content $out
          Get-ChildItem "release" -Filter "LocalVault-Portable-x64-v$ver.zip" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Add-Content $out
          }
          Get-ChildItem "release" -Filter "LocalVault-Fill-*.zip" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name | Add-Content $out
          }

      - name: Upload portable package and checksums
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $files = @("SHA256SUMS.txt")
          $portable = Get-ChildItem "release" -Filter "LocalVault-Portable-x64-v$ver.zip"
          if ($portable) { $files += $portable.FullName }
          $fill = Get-ChildItem "release" -Filter "LocalVault-Fill-*.zip"
          if ($fill) { $files += $fill.FullName }
          gh release upload "${{ github.ref_name }}" $files --clobber
